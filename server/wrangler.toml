name = "depo-zeta-whatsapp"
main = "whatsapp-webhook.mjs"
compatibility_date = "2026-08-19"

# Secretos — se cargan con `wrangler secret put NOMBRE`, nunca acá ni en el repo:
#   WA_VERIFY_TOKEN     el que elegís vos, se lo pasás a Meta al configurar el webhook
#   WA_ACCESS_TOKEN     token del System User de Meta Business Manager
#   WA_PHONE_NUMBER_ID  el id que Meta asigna al número dado de alta

